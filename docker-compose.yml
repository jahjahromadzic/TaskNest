services:
  postgres:
    image: postgres:17
    container_name: tasknest-db
    environment:
      POSTGRES_DB: tasknest
      POSTGRES_USER: tasknest
      POSTGRES_PASSWORD: tasknest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasknest"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: tasknest-mq
    environment:
      RABBITMQ_DEFAULT_USER: tasknest
      RABBITMQ_DEFAULT_PASS: tasknest
    ports:
      - "5672:5672"
      - "15672:15672"

  mailpit:
    image: axllent/mailpit:latest
    container_name: tasknest-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data: