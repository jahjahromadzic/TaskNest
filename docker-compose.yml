services:
  postgres:
    image: postgres:17
    container_name: tasknest-db
    environment:
      POSTGRES_DB: tasknest
      POSTGRES_USER: tasknest
      POSTGRES_PASSWORD: tasknest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasknest"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: tasknest-mq
    environment:
      RABBITMQ_DEFAULT_USER: tasknest
      RABBITMQ_DEFAULT_PASS: tasknest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: tasknest-mail
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    profiles: [app]
    build: .
    container_name: tasknest-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      TZ: Europe/Sarajevo
      DB_URL: jdbc:postgresql://postgres:5432/tasknest
      RABBITMQ_HOST: rabbitmq
      MAIL_HOST: mailpit
      FRONTEND_URL: http://localhost:4200
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    volumes:
      - photos_data:/app/photos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  frontend:
    profiles: [app]
    build: ./frontend
    container_name: tasknest-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  photos_data:
