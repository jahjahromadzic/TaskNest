app:
  jwt:
    secret: test-only-signing-key-with-enough-length-for-hs256
    expiration-minutes: 60
  refresh-token:
    expiration-days: 30
  mail:
    from: test@tasknest.ba
  cors:
    allowed-origins: http://localhost:4200
  task-expiry:
    enabled: false
  task-deadlines:
    enabled: false

spring:
  jpa:
    properties:
      hibernate:
        format_sql: false
        generate_statistics: true

logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: warn
    org.hibernate.SQL: warn
    liquibase: warn
