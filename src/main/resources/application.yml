server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

spring:
  application:
    name: TaskNest

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasknest}
    username: ${DB_USERNAME:tasknest}
    password: ${DB_PASSWORD:tasknest}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tasknest}
    password: ${RABBITMQ_PASSWORD:tasknest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: ${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
          initial-interval: ${RABBITMQ_RETRY_INITIAL_INTERVAL:1s}
          multiplier: 2
          max-interval: 10s

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: ${MAIL_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${MAIL_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${MAIL_TIMEOUT_MS:5000}

app:
  jwt:

    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

  refresh-token:
    expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:30}
    cookie-secure: ${REFRESH_COOKIE_SECURE:true}

  mail:
    from: ${MAIL_FROM:noreply@tasknest.ba}

  admin:
    email: ${APP_ADMIN_EMAIL:}

  frontend-url: ${FRONTEND_URL:http://localhost:4200}

  photos:
    directory: ${PHOTOS_DIRECTORY:data/photos}

  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}

  auth-throttle:
    login-attempts-per-email: ${LOGIN_ATTEMPTS_PER_EMAIL:5}
    login-attempts-per-address: ${LOGIN_ATTEMPTS_PER_ADDRESS:20}
    login-window-minutes: ${LOGIN_WINDOW_MINUTES:15}
    reset-requests-per-email: ${RESET_REQUESTS_PER_EMAIL:3}
    reset-requests-per-address: ${RESET_REQUESTS_PER_ADDRESS:10}
    reset-window-minutes: ${RESET_WINDOW_MINUTES:60}

  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
    password: ${DEMO_DATA_PASSWORD:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  task-deadlines:
    enabled: ${TASK_DEADLINES_ENABLED:true}
    assignment-start-days: ${TASK_ASSIGNMENT_START_DAYS:14}
    completion-close-days: ${TASK_COMPLETION_CLOSE_DAYS:7}
    interval-ms: ${TASK_DEADLINES_INTERVAL_MS:60000}

  task-expiry:
    enabled: ${TASK_EXPIRY_ENABLED:true}
    interval-ms: ${TASK_EXPIRY_INTERVAL_MS:60000}
    initial-delay-ms: ${TASK_EXPIRY_INITIAL_DELAY_MS:10000}
