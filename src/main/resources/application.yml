spring:
  application:
    name: TaskNest

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasknest}
    username: ${DB_USERNAME:tasknest}
    password: ${DB_PASSWORD:tasknest}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tasknest}
    password: ${RABBITMQ_PASSWORD:tasknest}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  jwt:
    # Namjerno bez upotrebljive podrazumijevane vrijednosti - svaki profil mora
    # zadati svoju. Prod trazi JWT_SECRET iz okruzenja i pada ako ga nema.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
