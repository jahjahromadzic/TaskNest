spring:
  application:
    name: TaskNest

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasknest}
    username: ${DB_USERNAME:tasknest}
    password: ${DB_PASSWORD:tasknest}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  data:
    web:
      pageable:
        default-page-size: 20
        # Springov podrazumijevani maksimum je 2000, sto je previse za jednu
        # stranu liste oglasa - size=100000 se inace tiho klampovao na 2000.
        max-page-size: 50

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tasknest}
    password: ${RABBITMQ_PASSWORD:tasknest}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  jwt:

    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

  refresh-token:
    expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:30}

  mail:
    from: ${MAIL_FROM:noreply@tasknest.ba}
