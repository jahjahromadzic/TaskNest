<div class="flex flex-col gap-4 animate-fade-in lg:h-[calc(100dvh-7rem)]">
  <div class="relative shrink-0 overflow-hidden flex flex-col md:flex-row md:items-center justify-between gap-4 bg-surface-card p-5 rounded-card border border-surface-border shadow-subtle">
    <div class="absolute -right-16 -top-24 w-64 h-64 rounded-full bg-brand-light/70 blur-3xl pointer-events-none" aria-hidden="true"></div>
    <div class="relative flex items-center gap-3">
      <span class="w-11 h-11 rounded-xl bg-gradient-to-br from-slate-800 to-slate-600 dark:from-slate-300 dark:to-slate-200 text-white flex items-center justify-center shadow-subtle">
        <svg [appIcon]="icons.Shield" class="w-5 h-5"></svg>
      </span>
      <div>
        <h1 class="text-2xl font-semibold tracking-tight">{{ 'admin.title' | t }}</h1>
        <p class="text-sm text-text-sub">{{ 'admin.subtitle' | t }}</p>
      </div>
    </div>

    <div role="tablist" [attr.aria-label]="'admin.sections' | t" class="relative flex gap-1 p-1 bg-slate-100 rounded-xl w-full md:w-fit">
      <button type="button" role="tab" (click)="open('users')" [attr.aria-selected]="tab() === 'users'"
              class="flex-1 md:flex-none px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-200"
              [class]="tab() === 'users' ? 'bg-surface-card text-text-main shadow-subtle' : 'text-slate-500 hover:text-text-main'">
        {{ 'admin.tabUsers' | t }}
      </button>
      <button type="button" role="tab" (click)="open('tasks')" [attr.aria-selected]="tab() === 'tasks'"
              class="flex-1 md:flex-none px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-200"
              [class]="tab() === 'tasks' ? 'bg-surface-card text-text-main shadow-subtle' : 'text-slate-500 hover:text-text-main'">
        {{ 'admin.tabTasks' | t }}
      </button>
    </div>
  </div>

  <div class="shrink-0 grid grid-cols-2 lg:grid-cols-4 gap-3">
    @if (tiles(); as tiles) {
      @for (tile of tiles; track tile.filter; let i = $index) {
        <button type="button" (click)="open(tile.tab, tile.filter)"
                class="group text-left bg-surface-card p-4 rounded-card border border-surface-border shadow-subtle flex items-center gap-3 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-card hover:border-brand/30 animate-fade-in"
                [style.animation-delay.ms]="i * 50">
          <span class="shrink-0 w-10 h-10 rounded-xl flex items-center justify-center transition-transform duration-200 group-hover:scale-110"
                [class]="tile.tone">
            <svg [appIcon]="tile.icon" class="w-5 h-5"></svg>
          </span>
          <span class="min-w-0">
            <span class="block text-xs text-text-sub">{{ tile.label }}</span>
            <span class="block text-xl font-bold tabular-nums leading-tight">{{ tile.value }}</span>
            <span class="block text-[11px] text-slate-400 truncate">{{ tile.note }}</span>
          </span>
        </button>
      } @empty {
        <p class="col-span-full text-sm text-text-sub flex items-center gap-2">
          <svg [appIcon]="icons.ShieldAlert" class="w-4 h-4"></svg> {{ 'admin.overviewFailed' | t }}
        </p>
      }
    } @else {
      @for (tile of skeletons; track tile) {
        <div class="bg-surface-card p-4 rounded-card border border-surface-border flex items-center gap-3" aria-hidden="true">
          <span class="skeleton w-10 h-10 rounded-xl"></span>
          <span class="flex-1 space-y-1.5">
            <span class="skeleton block h-3 w-16"></span>
            <span class="skeleton block h-5 w-10"></span>
          </span>
        </div>
      }
    }
  </div>

  <div class="lg:flex-1 lg:min-h-0 flex flex-col">
    @if (tab() === 'users') {
      <app-admin-users class="contents" (changed)="loadStats()" />
    } @else {
      <app-admin-tasks class="contents" (changed)="loadStats()" />
    }
  </div>
</div>
