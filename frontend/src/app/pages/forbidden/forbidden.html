<div class="bg-white p-10 rounded-card border border-surface-border shadow-subtle text-center animate-slide-in space-y-3 max-w-lg mx-auto">
  <div class="mx-auto w-12 h-12 rounded-full bg-red-50 text-status-error flex items-center justify-center">
    <svg [appIcon]="icons.ShieldAlert" class="w-6 h-6"></svg>
  </div>
  <h1 class="text-2xl font-semibold tracking-tight">{{ 'errors.forbiddenTitle' | t }}</h1>
  <p class="text-text-sub text-sm">{{ 'errors.forbiddenText' | t }}</p>
  <a routerLink="/tasks" class="btn-primary py-2">
    {{ 'errors.backToTasks' | t }}
  </a>
</div>
