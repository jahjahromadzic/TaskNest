<a [routerLink]="['/tasks', task.id]"
   class="group block bg-white p-4 sm:p-5 rounded-card border border-surface-border shadow-subtle transition-all duration-200
          hover:border-brand/40 hover:shadow-card hover:-translate-y-0.5
          focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand/20">
  <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
    <div class="space-y-2 flex-1 min-w-0">
      <span class="inline-flex items-center gap-1.5 bg-brand-50 text-brand border border-brand/20 px-2.5 py-0.5 rounded-full text-xs font-medium">
        <app-category-icon [name]="task.categoryName" size="w-3 h-3" />
        {{ task.categoryName }}
      </span>

      <h2 class="text-base sm:text-lg font-semibold text-text-main group-hover:text-brand transition-colors line-clamp-2">
        {{ task.title }}
      </h2>

      <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 text-xs text-slate-500">
        <span class="flex items-center gap-1 font-medium text-text-main">
          <svg lucideMapPin class="w-3.5 h-3.5 text-brand"></svg> {{ task.municipalityName }}
        </span>
        <span class="flex items-center gap-1">
          <svg lucideClock class="w-3.5 h-3.5 text-slate-400"></svg> Posted {{ postedAgo }}
        </span>
        @if (daysLeft !== null) {
          <span class="flex items-center gap-1 px-2 py-0.5 rounded"
                [class]="daysLeft <= 3 ? 'text-red-700 bg-red-50' : 'text-amber-700 bg-amber-50'">
            <svg lucideHourglass class="w-3.5 h-3.5"></svg>
            {{ daysLeft === 0 ? 'Ends today' : daysLeft === 1 ? '1 day left' : daysLeft + ' days left' }}
          </span>
        }
      </div>
    </div>

    <div class="flex sm:flex-col justify-between items-center sm:items-end gap-2 border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-100 shrink-0">
      <div class="sm:text-right">
        <span class="text-[11px] uppercase tracking-wide text-slate-400 block">Budget</span>
        <span class="font-bold" [class]="task.budget == null ? 'text-base text-slate-500' : 'text-xl text-brand'">{{ budget }}</span>
      </div>
      <span class="inline-flex items-center gap-1 text-xs font-semibold text-brand bg-brand-light/60 px-3 py-1.5 rounded-btn
                   transition-all duration-200 group-hover:bg-brand group-hover:text-white">
        View details
        <svg lucideArrowRight class="w-3.5 h-3.5 transition-transform duration-200 group-hover:translate-x-0.5"></svg>
      </span>
    </div>
  </div>
</a>
