<dialog #dialog (cancel)="$event.preventDefault(); onEscape()" aria-labelledby="report-title"
        class="hidden open:flex fixed inset-0 m-0 w-full h-full max-w-none max-h-none p-4 bg-transparent items-end sm:items-center justify-center backdrop:bg-transparent">
  <div class="absolute inset-0 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm animate-fade-in" (click)="onEscape()" aria-hidden="true"></div>
  <form (ngSubmit)="submit()" novalidate
        class="relative w-full max-w-md bg-surface-card rounded-2xl shadow-modal border border-surface-border p-6 space-y-4 animate-slide-in">
    <div class="flex items-start gap-4">
      <span class="shrink-0 w-11 h-11 rounded-full bg-red-50 text-status-error flex items-center justify-center">
        <svg [appIcon]="icons.Flag" class="w-5 h-5"></svg>
      </span>
      <div class="min-w-0 space-y-1 pt-0.5">
        <h2 id="report-title" class="text-lg font-semibold leading-snug">
          {{ (target === 'TASK' ? 'report.titleTask' : 'report.titleUser') | t }}
        </h2>
        <p class="text-sm text-text-sub truncate">{{ targetName }}</p>
      </div>
    </div>

    <fieldset class="space-y-1.5">
      <legend class="form-label">{{ 'report.why' | t }}</legend>
      @for (option of reasons; track option) {
        <label class="flex items-center gap-3 px-3 py-2 rounded-btn border cursor-pointer text-sm transition-all duration-200"
               [class]="reason() === option ? 'border-red-300 bg-red-50 text-red-800' : 'border-surface-border hover:border-slate-300'">
          <input type="radio" name="reason" [value]="option" [checked]="reason() === option" (change)="pick(option)"
                 class="accent-red-600">
          {{ reasonKey(option) | t }}
        </label>
      }
    </fieldset>

    <div class="space-y-1.5">
      <label for="report-comment" class="form-label flex justify-between">
        <span>
          {{ 'report.comment' | t }}
          @if (reason() !== 'OTHER') {
            <span class="font-normal text-text-sub">{{ 'common.optional' | t }}</span>
          }
        </span>
        <span class="font-normal text-slate-400 tabular-nums">{{ comment.length }}/{{ commentMax }}</span>
      </label>
      <textarea id="report-comment" name="comment" rows="2" [(ngModel)]="comment" [maxlength]="commentMax"
                (ngModelChange)="error.set(null)" [placeholder]="'report.commentPlaceholder' | t"
                class="form-input resize-none"></textarea>
    </div>

    @if (error(); as message) {
      <p role="alert" class="form-error animate-shake">{{ message }}</p>
    }

    <p class="text-xs text-text-sub">{{ 'report.privacy' | t }}</p>

    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 pt-1">
      <button type="button" (click)="onEscape()" [disabled]="sending()" class="btn-ghost border border-surface-border">
        {{ 'common.cancel' | t }}
      </button>
      <button type="submit" [disabled]="sending()"
              class="btn-primary bg-status-error hover:bg-status-error/90 focus-visible:ring-red-200">
        @if (sending()) {
          <svg [appIcon]="icons.LoaderCircle" class="w-4 h-4 animate-spin"></svg> {{ 'report.sending' | t }}
        } @else {
          {{ 'report.send' | t }}
        }
      </button>
    </div>
  </form>
</dialog>
