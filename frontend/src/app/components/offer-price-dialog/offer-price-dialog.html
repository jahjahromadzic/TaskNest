<dialog #dialog (cancel)="$event.preventDefault(); onEscape()" aria-labelledby="offer-price-title"
        class="hidden open:flex fixed inset-0 m-0 w-full h-full max-w-none max-h-none p-4 bg-transparent items-end sm:items-center justify-center backdrop:bg-transparent">
  <div class="absolute inset-0 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm animate-fade-in" (click)="onEscape()" aria-hidden="true"></div>
  <form (ngSubmit)="submit()" novalidate
        class="relative w-full max-w-sm bg-surface-card rounded-2xl shadow-modal border border-surface-border p-6 space-y-4 animate-slide-in">
    <div class="flex items-start gap-4">
      <span class="shrink-0 w-11 h-11 rounded-full bg-brand-50 text-brand flex items-center justify-center">
        <svg [appIcon]="icons.Tag" class="w-5 h-5"></svg>
      </span>
      <div class="min-w-0 space-y-1 pt-0.5">
        <h2 id="offer-price-title" class="text-lg font-semibold leading-snug">{{ 'offerPrice.title' | t }}</h2>
        <p class="text-sm text-text-sub">{{ 'offerPrice.current' | t: { price: formatBudget(currentPrice) } }}</p>
      </div>
    </div>

    <div class="space-y-1.5">
      <label for="offer-new-price" class="form-label">{{ 'offerPrice.newPrice' | t }}</label>
      <div class="relative">
        <input id="offer-new-price" name="price" type="number" inputmode="decimal" min="1" step="1"
               [(ngModel)]="price" (ngModelChange)="error.set(null)" class="form-input pr-12"
               [class.form-input-invalid]="error() !== null">
        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-semibold text-slate-400 pointer-events-none">KM</span>
      </div>
    </div>

    <div class="space-y-1.5">
      <label for="offer-price-note" class="form-label">
        {{ 'offerPrice.note' | t }} <span class="font-normal text-text-sub">{{ 'common.optional' | t }}</span>
      </label>
      <textarea id="offer-price-note" name="note" rows="2" [(ngModel)]="note" [maxlength]="noteMax"
                [placeholder]="'offerPrice.notePlaceholder' | t" class="form-input resize-none"></textarea>
    </div>

    <p class="form-error min-h-4" role="alert">{{ error() }}</p>

    <p class="text-xs text-text-sub -mt-2">{{ 'offerPrice.hint' | t }}</p>

    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 pt-1">
      <button type="button" (click)="onEscape()" [disabled]="saving()" class="btn-ghost border border-surface-border">
        {{ 'common.cancel' | t }}
      </button>
      <button type="submit" [disabled]="saving()" class="btn-primary">
        @if (saving()) {
          <svg [appIcon]="icons.LoaderCircle" class="w-4 h-4 animate-spin"></svg> {{ 'common.saving' | t }}
        } @else {
          {{ 'offerPrice.save' | t }}
        }
      </button>
    </div>
  </form>
</dialog>
