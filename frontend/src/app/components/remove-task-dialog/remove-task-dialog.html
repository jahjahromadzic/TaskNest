<dialog #dialog (cancel)="$event.preventDefault(); onEscape()" aria-labelledby="remove-title"
        class="hidden open:flex fixed inset-0 m-0 w-full h-full max-w-none max-h-none p-4 bg-transparent items-end sm:items-center justify-center backdrop:bg-transparent">
  <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm animate-fade-in" (click)="onEscape()" aria-hidden="true"></div>
  <form (ngSubmit)="submit()" novalidate
        class="relative w-full max-w-md bg-white rounded-2xl shadow-modal border border-surface-border p-6 space-y-4 animate-slide-in">
    <div class="flex items-start gap-4">
      <span class="shrink-0 w-11 h-11 rounded-full bg-red-50 text-status-error flex items-center justify-center">
        <svg [appIcon]="icons.ShieldAlert" class="w-5 h-5"></svg>
      </span>
      <div class="min-w-0 space-y-1 pt-0.5">
        <h2 id="remove-title" class="text-lg font-semibold leading-snug">{{ 'remove.title' | t }}</h2>
        <p class="text-sm text-text-sub truncate">"{{ taskTitle }}"</p>
      </div>
    </div>

    <p class="text-sm text-text-sub leading-relaxed">
      {{ 'remove.text' | t }}
    </p>

    <div class="space-y-2">
      <label for="remove-reason" class="form-label flex justify-between">
        <span>{{ 'remove.reason' | t }}</span>
        <span class="font-normal text-slate-400 tabular-nums">{{ reason.length }}/{{ reasonMax }}</span>
      </label>
      <div class="flex flex-wrap gap-1.5">
        @for (common of commonReasons; track common) {
          <button type="button" (click)="pick(common)"
                  class="px-2.5 py-1 rounded-full border text-xs font-medium transition-all duration-200 active:scale-95"
                  [class]="reason === (common | t) ? 'bg-red-50 border-red-300 text-red-700' : 'bg-slate-50 border-slate-200 text-text-sub hover:border-slate-300 hover:text-text-main'">
            {{ common | t }}
          </button>
        }
      </div>
      <textarea id="remove-reason" name="reason" rows="3" [(ngModel)]="reason" [maxlength]="reasonMax"
                (ngModelChange)="error.set(null)" [placeholder]="'remove.placeholder' | t"
                class="form-input resize-none" [class.form-input-invalid]="error() !== null"></textarea>
      @if (error(); as message) {
        <p role="alert" class="form-error animate-shake">{{ message }}</p>
      }
    </div>

    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 pt-1">
      <button type="button" (click)="onEscape()" [disabled]="sending()" class="btn-ghost border border-surface-border">
        {{ 'remove.keep' | t }}
      </button>
      <button type="submit" [disabled]="sending()"
              class="btn-primary bg-status-error hover:bg-red-700 focus-visible:ring-red-200">
        @if (sending()) {
          <svg [appIcon]="icons.LoaderCircle" class="w-4 h-4 animate-spin"></svg> {{ 'remove.removing' | t }}
        } @else {
          {{ 'remove.confirm' | t }}
        }
      </button>
    </div>
  </form>
</dialog>
