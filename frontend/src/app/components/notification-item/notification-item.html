<button type="button" (click)="opened.emit(notification)"
        class="group w-full text-left flex items-start gap-3 rounded-btn transition-colors duration-200 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand/20"
        [class]="(compact ? 'p-2.5 ' : 'p-4 ') + (notification.read ? 'hover:bg-slate-50' : 'bg-brand-50/50 hover:bg-brand-50')">
  <span class="shrink-0 rounded-full flex items-center justify-center transition-transform duration-200 group-hover:scale-110"
        [class]="kind.tone + (compact ? ' w-8 h-8' : ' w-10 h-10')">
    <svg [appIcon]="kind.icon" [class]="compact ? 'w-4 h-4' : 'w-5 h-5'"></svg>
  </span>
  <span class="min-w-0 flex-1">
    <span class="flex items-center justify-between gap-2">
      <span class="font-semibold truncate" [class]="compact ? 'text-xs' : 'text-sm'">{{ kind.title }}</span>
      <span class="shrink-0 text-[11px] text-slate-400">{{ timeAgo(notification.createdAt) }}</span>
    </span>
    <span class="block text-text-sub mt-0.5" [class]="compact ? 'text-xs line-clamp-2' : 'text-sm'">{{ content }}</span>
  </span>
  @if (!notification.read) {
    <span class="shrink-0 mt-1.5 w-2 h-2 rounded-full bg-brand ring-4 ring-brand/15" [attr.aria-label]="'common.unread' | t"></span>
  }
</button>
