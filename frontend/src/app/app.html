<header class="bg-white border-b border-surface-border px-4 py-3">
  <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-brand text-white p-2 rounded-lg">
        <svg lucideSquareCheck class="w-5 h-5"></svg>
      </div>
      <span class="text-xl font-bold tracking-tight flex items-center gap-1.5">
        TaskNest
        <span class="text-[10px] bg-brand-light text-brand font-semibold px-1.5 py-0.5 rounded border border-brand/20">BiH</span>
      </span>
    </div>
    <div class="flex items-center gap-2">
      <button class="p-2 rounded-lg text-slate-600 hover:bg-slate-100" title="Messages">
        <svg lucideMessageSquare class="w-5 h-5"></svg>
      </button>
      <button class="p-2 rounded-lg text-slate-600 hover:bg-slate-100" title="Notifications">
        <svg lucideBell class="w-5 h-5"></svg>
      </button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-card border border-surface-border shadow-subtle">
    <div>
      <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight">Browse Local Tasks</h1>
      <p class="text-text-sub text-sm mt-0.5">Find home service jobs in your municipality or post a new request</p>
    </div>
    <button class="bg-brand hover:bg-brand-hover text-white px-4 py-2 rounded-btn text-sm font-semibold flex items-center gap-2 transition-colors">
      <svg lucidePlus class="w-4 h-4"></svg>
      Post a Task
    </button>
  </div>

  <article class="bg-white p-5 rounded-card border border-surface-border shadow-card flex flex-col sm:flex-row sm:items-start justify-between gap-4">
    <div class="space-y-2">
      <div class="flex flex-wrap items-center gap-2">
        <span class="inline-flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded-full bg-brand-50 text-brand border border-brand/20">
          <svg lucideWrench class="w-3 h-3"></svg> Plumbing
        </span>
        <span class="inline-flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded-full bg-brand-light text-brand">
          <svg lucideGlobe class="w-3 h-3"></svg> Published
        </span>
      </div>
      <h2 class="text-lg font-semibold">Fix leaking kitchen sink pipe</h2>
      <p class="text-sm text-text-sub">Under-sink pipe has a steady drip causing cabinet damage.</p>
      <div class="flex flex-wrap items-center gap-4 text-xs text-text-sub">
        <span class="flex items-center gap-1"><svg lucideMapPin class="w-3.5 h-3.5"></svg> Sarajevo - Centar</span>
        <span class="flex items-center gap-1 text-accent"><svg lucideHourglass class="w-3.5 h-3.5"></svg> Expires in 12 days</span>
        <span class="flex items-center gap-1"><svg lucideStar class="w-3.5 h-3.5 text-accent fill-accent"></svg> 4.9</span>
      </div>
    </div>
    <div class="sm:text-right shrink-0">
      <p class="text-xs text-text-sub">Est. Budget</p>
      <p class="text-2xl font-bold text-brand">120 KM</p>
    </div>
  </article>
</main>

<router-outlet />
