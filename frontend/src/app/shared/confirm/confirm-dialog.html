@if (confirmService.pending(); as dialog) {
  <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm animate-fade-in" (click)="confirmService.answer(false)"
         aria-hidden="true"></div>
    <div role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message"
         class="relative w-full max-w-md bg-surface-card rounded-2xl shadow-modal border border-surface-border p-6 space-y-4 animate-slide-in">
      <div class="flex items-start gap-4">
        <span class="shrink-0 w-11 h-11 rounded-full flex items-center justify-center"
              [class]="dialog.tone === 'danger' ? 'bg-red-50 text-status-error' : 'bg-brand-50 text-brand'">
          <svg [appIcon]="dialog.tone === 'danger' ? icons.CircleAlert : icons.CircleHelp" class="w-5 h-5"></svg>
        </span>
        <div class="space-y-1.5 pt-0.5">
          <h2 id="confirm-title" class="text-lg font-semibold leading-snug">{{ dialog.title }}</h2>
          <p id="confirm-message" class="text-sm text-text-sub leading-relaxed">{{ dialog.message }}</p>
        </div>
      </div>
      <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 pt-2">
        <button type="button" (click)="confirmService.answer(false)" class="btn-ghost border border-surface-border">
          {{ dialog.cancelLabel ?? ('common.cancel' | t) }}
        </button>
        <button #confirmButton type="button" (click)="confirmService.answer(true)"
                [class]="dialog.tone === 'danger' ? 'btn-primary bg-status-error hover:bg-status-error/90 focus-visible:ring-red-500/25' : 'btn-primary'">
          {{ dialog.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
