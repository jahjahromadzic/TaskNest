@if (authService.user$ | async) {
  <nav class="sm:hidden fixed bottom-0 inset-x-0 z-40 bg-white/90 backdrop-blur-md border-t border-surface-border px-2 pt-1.5 pb-[max(0.375rem,env(safe-area-inset-bottom))]
              grid grid-cols-4 text-[11px] font-medium animate-fade-in">
    <a routerLink="/tasks" routerLinkActive="active" class="bottom-nav-item group">
      <svg [appIcon]="icons.House" class="w-5 h-5"></svg>
      Browse
    </a>
    <a routerLink="/my-tasks" routerLinkActive="active" class="bottom-nav-item group">
      <svg [appIcon]="icons.ListTodo" class="w-5 h-5"></svg>
      My tasks
    </a>
    <a routerLink="/messages" routerLinkActive="active" class="bottom-nav-item group">
      <svg [appIcon]="icons.MessageSquare" class="w-5 h-5"></svg>
      Messages
    </a>
    <a routerLink="/notifications" routerLinkActive="active" class="bottom-nav-item group">
      <svg [appIcon]="icons.Bell" class="w-5 h-5"></svg>
      Alerts
    </a>
  </nav>
}
